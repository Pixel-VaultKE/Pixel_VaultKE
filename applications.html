<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Upload Team Applications — Elite Customs</title>
<style>
  body { font-family: -apple-system, Arial, sans-serif; background:#0D0D10; color:#eee; margin:0; padding:16px; }
  h1 { font-size:1.3rem; margin:0 0 4px; }
  h2 { font-size:1rem; margin:24px 0 10px; color:#9ca3af; }
  .sub { color:#9ca3af; font-size:0.85rem; margin-bottom:16px; }
  .card { background:#15151d; border:1px solid #23232e; border-radius:12px; padding:14px; margin-bottom:10px; }
  .name { font-weight:700; font-size:1rem; }
  .meta { color:#9ca3af; font-size:0.8rem; margin:2px 0 8px; }
  .why { font-size:0.88rem; color:#d1d5db; margin-bottom:10px; white-space:pre-wrap; }
  .btnRow { display:flex; gap:8px; }
  .btn { flex:1; padding:10px; border-radius:9px; border:none; font-weight:700; font-size:0.85rem; }
  .approve { background:#25D366; color:#0D0D10; }
  .reject { background:#3a1f1f; color:#f87171; border:1px solid #5c2b2b; }
  .btn:disabled { opacity:0.5; }
  #loginSection { max-width:340px; margin:60px auto; text-align:center; }
  #loginSection input { width:100%; box-sizing:border-box; padding:12px; border-radius:10px;
    border:1px solid #2a2a35; background:#15151d; color:#fff; margin-bottom:10px; }
  #loginSection button { width:100%; padding:12px; border-radius:10px; border:none;
    background:#C6FF3D; color:#0D0D10; font-weight:800; }
  .hidden { display:none; }
  .error { color:#f87171; font-size:0.85rem; margin-top:6px; }
  .empty { color:#6b7280; text-align:center; padding:20px 0; font-size:0.9rem; }
  .rateBox { background:#15151d; border:1px solid #23232e; border-radius:12px; padding:14px; margin-bottom:20px; }
  .rateBox input { width:100px; padding:8px 10px; border-radius:8px; border:1px solid #2a2a35;
    background:#0D0D10; color:#fff; font-size:1rem; margin-right:8px; }
  .rateBox button { padding:8px 14px; border-radius:8px; border:none; background:#C6FF3D;
    color:#0D0D10; font-weight:700; }
  .rateLine { font-size:0.85rem; color:#9ca3af; margin-bottom:8px; }
</style>
</head>
<body>

<div id="loginSection">
  <h1>Staff sign in</h1>
  <div class="sub">Owner / admin accounts only</div>
  <input type="email" id="aEmail" placeholder="Email">
  <input type="password" id="aPass" placeholder="Password">
  <button onclick="doLogin()">Sign In</button>
  <div class="error" id="loginMsg"></div>
</div>

<div id="mainSection" class="hidden">
  <h1>Upload Team</h1>
  <div class="sub" id="countLine"></div>

  <div class="rateBox">
    <div class="rateLine">Current rate per accepted picture: <b id="currentRate">—</b></div>
    <input type="number" id="newRate" step="0.01" min="0" placeholder="e.g. 1.65">
    <button onclick="saveRate()">Set Rate</button>
    <div class="error" id="rateMsg"></div>
  </div>

  <h2>🕓 Pending applications</h2>
  <div id="pendingList"></div>

  <h2>✅ Approved</h2>
  <div id="approvedList"></div>

  <h2>❌ Rejected</h2>
  <div id="rejectedList"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-functions-compat.js"></script>
<script src="shared.js"></script>
<script>
// firebaseConfig / firebase.initializeApp / db / auth / escapeHtml come
// from shared.js, same as the rest of this codebase.

var allApplications = [];

async function loadApplications() {
  document.getElementById('countLine').textContent = 'Loading...';
  try {
    var snap = await db.collection('uploadApplications').orderBy('submittedAt', 'desc').limit(300).get();
    allApplications = snap.docs.map(function (d) { return { id: d.id, data: d.data() }; });
    document.getElementById('countLine').textContent = allApplications.length + ' application' + (allApplications.length === 1 ? '' : 's');
    renderApplications();
  } catch (e) {
    document.getElementById('countLine').textContent = '';
    document.getElementById('pendingList').innerHTML = '<div class="error">Could not load applications: ' + escapeHtml(e.message) + '</div>';
  }
}

function appCardHtml(a, showButtons) {
  var d = a.data;
  var dateStr = d.submittedAt && d.submittedAt.toDate ? d.submittedAt.toDate().toLocaleString() : '';
  var html = '<div class="card">' +
    '<div class="name">' + escapeHtml(d.applicantName) + '</div>' +
    '<div class="meta">' + escapeHtml(d.phone) + ' · ' + escapeHtml(d.email) + (dateStr ? ' · ' + dateStr : '') + '</div>' +
    '<div class="why">' + escapeHtml(d.whyInterested) + '</div>';
  if (d.experience) {
    html += '<div class="why" style="color:#9ca3af">Experience: ' + escapeHtml(d.experience) + '</div>';
  }
  if (showButtons) {
    html += '<div class="btnRow">' +
      '<button class="btn approve" onclick="review(\'' + a.id + '\',\'approve\',this)">Approve</button>' +
      '<button class="btn reject" onclick="review(\'' + a.id + '\',\'reject\',this)">Reject</button>' +
      '</div>';
  } else if (d.reviewNotes) {
    html += '<div class="meta">Note: ' + escapeHtml(d.reviewNotes) + '</div>';
  }
  html += '</div>';
  return html;
}

function renderApplications() {
  var pending = allApplications.filter(function (a) { return a.data.status === 'pending'; });
  var approved = allApplications.filter(function (a) { return a.data.status === 'approved'; });
  var rejected = allApplications.filter(function (a) { return a.data.status === 'rejected'; });

  document.getElementById('pendingList').innerHTML = pending.length
    ? pending.map(function (a) { return appCardHtml(a, true); }).join('')
    : '<div class="empty">No pending applications</div>';
  document.getElementById('approvedList').innerHTML = approved.length
    ? approved.map(function (a) { return appCardHtml(a, false); }).join('')
    : '<div class="empty">None yet</div>';
  document.getElementById('rejectedList').innerHTML = rejected.length
    ? rejected.map(function (a) { return appCardHtml(a, false); }).join('')
    : '<div class="empty">None yet</div>';
}

async function review(applicationId, decision, btn) {
  var label = decision === 'approve' ? 'approve' : 'reject';
  if (!confirm('Are you sure you want to ' + label + ' this application?')) return;
  // Real gap this closes: nothing stopped a fast double-click from firing
  // two reviewApplication calls for the same application before the
  // first one finished — the Cloud Function itself would only let one
  // actually succeed (the second reads status !== 'pending' and fails,
  // or a genuine Auth email-collision error surfaces), but the person
  // clicking just sees a confusing failure on what was actually a
  // successful approval. Disabling both buttons the instant either is
  // pressed removes the race, not just papers over its symptom.
  var row = btn ? btn.parentElement : null;
  var buttons = row ? row.querySelectorAll('button') : [];
  buttons.forEach(function (b) { b.disabled = true; });
  try {
    var reviewApplication = firebase.functions().httpsCallable('reviewApplication');
    await reviewApplication({ applicationId: applicationId, decision: decision, notes: '' });
    await loadApplications();
  } catch (e) {
    alert('Could not ' + label + ': ' + e.message);
    buttons.forEach(function (b) { b.disabled = false; });
  }
}

async function loadRate() {
  try {
    var snap = await db.collection('settings').doc('uploaderRate').get();
    var rate = snap.exists ? snap.data().rate : null;
    document.getElementById('currentRate').textContent = rate != null ? ('KSh ' + rate) : 'not set';
  } catch (e) {
    document.getElementById('currentRate').textContent = 'error loading';
  }
}

async function saveRate() {
  var val = parseFloat(document.getElementById('newRate').value);
  var msgEl = document.getElementById('rateMsg');
  msgEl.textContent = '';
  if (isNaN(val) || val < 0) { msgEl.textContent = 'Enter a valid rate.'; return; }
  try {
    await db.collection('settings').doc('uploaderRate').set({
      rate: val,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      updatedBy: firebase.auth().currentUser.uid
    }, { merge: true });
    document.getElementById('newRate').value = '';
    loadRate();
  } catch (e) {
    msgEl.textContent = 'Could not save: ' + e.message;
  }
}

auth.onAuthStateChanged(async function (user) {
  if (!user) {
    document.getElementById('loginSection').classList.remove('hidden');
    document.getElementById('mainSection').classList.add('hidden');
    return;
  }
  try {
    var snap = await db.collection('workers').doc(user.uid).get();
    if (!snap.exists || (snap.data().role !== 'owner' && snap.data().role !== 'admin')) {
      await auth.signOut();
      document.getElementById('loginMsg').textContent = 'This account is not an owner or admin account';
      return;
    }
    document.getElementById('loginSection').classList.add('hidden');
    document.getElementById('mainSection').classList.remove('hidden');
    loadApplications();
    loadRate();
  } catch (e) {
    await auth.signOut();
    document.getElementById('loginMsg').textContent = 'Could not verify account';
  }
});

async function doLogin() {
  var email = document.getElementById('aEmail').value.trim();
  var pass = document.getElementById('aPass').value;
  var msg = document.getElementById('loginMsg');
  msg.textContent = '';
  if (!email || !pass) { msg.textContent = 'Enter email and password'; return; }
  try {
    await auth.signInWithEmailAndPassword(email, pass);
  } catch (e) {
    msg.textContent = e.message;
  }
}
</script>
</body>
</html>
